services:
  api:
    networks: [default, sir-net]
    environment:
      OCR_PUBLIC_ORIGIN: https://ocr.sir-labs.com
      # Finished results are copied to the central store, by container name on sir-net.
      DATA_URL: ${DATA_URL:-http://sir-data-api-1:8000}
      DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:-}
    labels:
      proxy.enable: 'true'
      proxy.host: ocr.sir-labs.com
      proxy.port: '8000'
      proxy.max_body_size: '51m'
networks:
  sir-net:
    name: sir-server_sir-net
    external: true
